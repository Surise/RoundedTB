name: Build and publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore RoundedTB.sln -NonInteractive

      - name: Publish Release
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/RoundedTB-win-x64"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          msbuild RoundedTB.sln /t:Publish `
            /p:Configuration=Release `
            "/p:Platform=Any CPU" `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            "/p:PublishDir=$publishDir"

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/RoundedTB-win-x64"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "artifacts/RoundedTB-win-x64.zip"
          Compress-Archive -Path (Join-Path $publishDir "*") `
            -DestinationPath $archivePath -CompressionLevel Optimal -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoundedTB-win-x64
          path: artifacts/RoundedTB-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RoundedTB ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/RoundedTB-win-x64.zip
